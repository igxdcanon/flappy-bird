<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puff: a flappy-style game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐦</text></svg>">
<style>
html,body{margin:0;height:100%;background:#0d0a1f;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
canvas{display:block;border-radius:0}
#mute{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,12,50,.55);color:#fff;font-size:20px;cursor:pointer}
#mute:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Puff game. Tap, click or press space to flap."></canvas>
<button id="mute" aria-label="Toggle sound">🔊</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 360, H = 640, GROUND = 80, GRAV = 1500, FLAP = -430, PW = 62, GAP = 156;
let scale = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  scale = s * dpr;
}
addEventListener('resize', resize);
resize();

let state = 'ready', score = 0, best = 0, newBest = false, overAt = 0, t = 0, speed = 140, shake = 0;
let pipes = [], parts = [], gx = 0, hx = 0;
try { best = +localStorage.getItem('puff-best') || 0; } catch (e) {}
let muted = false;
try { muted = localStorage.getItem('puff-muted') === '1'; } catch (e) {}
const muteBtn = document.getElementById('mute');
muteBtn.textContent = muted ? '🔇' : '🔊';

const bird = { x: 96, y: H / 2 - 40, vy: 0, rot: 0, r: 12 };
const stars = Array.from({ length: 45 }, () => ({ x: Math.random() * W, y: Math.random() * 330, r: Math.random() * 1.4 + .4, ph: Math.random() * 6 }));
const clouds = Array.from({ length: 4 }, (_, i) => ({ x: i * 110, y: 90 + Math.random() * 220, w: 60 + Math.random() * 50, s: 8 + Math.random() * 8 }));

/* Bird head picture */
